<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOD X HARRY - Community & Strategy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07110e;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Inter',sans-serif;padding:0}
.container{width:100%;max-width:420px;min-height:100vh;background:#0a1813;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative}
.card{width:100%;max-width:380px;background:linear-gradient(180deg,#13251c 0%,#0a1813 100%);border:1px solid rgba(255,255,255,0.07);border-radius:32px;padding:35px 25px;text-align:center}
.logo{width:140px;height:140px;margin:0 auto 25px;border-radius:50%;background:#000;border:2px solid #d4af37;box-shadow:0 0 35px rgba(212,175,55,0.45);overflow:hidden;display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:cover}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(212,175,55,0.4);background:rgba(0,0,0,0.4);padding:8px 18px;border-radius:50px;color:#d4af37;font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:22px}
.title{font-family:'Cinzel',serif;font-size:32px;font-weight:800;color:#fff;letter-spacing:1px;margin-bottom:18px}
.sub{color:#fff;font-weight:800;font-size:15px;margin-bottom:10px;letter-spacing:0.5px}
.desc{color:#8aa899;font-size:12px;margin-bottom:28px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:linear-gradient(90deg,#ffcc33 0%,#ffde59 100%);color:#000;padding:19px;border-radius:100px;font-weight:900;font-size:16px;text-decoration:none;box-shadow:0 10px 30px rgba(255,204,51,0.3)}
.btn:active{transform:scale(0.98)}
.note{margin-top:16px;color:#5f7d6f;font-size:10px;font-weight:700;letter-spacing:1.2px}
.stats{margin-top:28px;display:flex;border:1px solid rgba(255,255,255,0.07);background:rgba(0,0,0,0.2);border-radius:20px;padding:16px 5px}
.s{flex:1;text-align:center;border-right:1px solid rgba(255,255,255,0.07)}
.s:last-child{border:0}
.s b{color:#ffcc33;font-size:22px;display:block;font-weight:900}
.s span{color:#7a9a8a;font-size:9px;letter-spacing:1px;font-weight:700;display:block;margin-top:4px}
</style>
</head>
<body>
<div class="container">
<div class="card">
  <div class="logo"><img src="logo.png" alt="Reddy Anna Club"></div>
  <div class="badge">🛡️ COMMUNITY & STRATEGY</div>
  <div class="title">GOD X HARRY</div>
  <div class="sub">🔥 NUMBER SHOT 🔥</div>
  <div class="desc">Market Trends • Strategy Discussions • Daily Updates</div>
  <a href="https://t.me/+LcvvQsa6vWEwYzM1" class="btn">◉ JOIN TELEGRAM →</a>
  <div class="note">⚡ INSTANT ACCESS • FREE COMMUNITY</div>
  <div class="stats">
    <div class="s"><b>24/7</b><span>COMMUNITY</span></div>
    <div class="s"><b>8K+</b><span>MEMBERS</span></div>
    <div class="s"><b>LIVE</b><span>UPDATES</span></div>
  </div>
</div>
</div>
</body>
</html>
