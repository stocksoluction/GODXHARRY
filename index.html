<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HARRY - Community & Strategy</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#08120f;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:'Inter',sans-serif;
  padding:20px;
}
.card{
  width:100%;
  max-width:400px;
  background:linear-gradient(180deg,#10201a 0%,#0a1511 100%);
  border:1px solid rgba(255,215,0,0.12);
  border-radius:28px;
  padding:30px 24px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}
.logo-wrap{
  width:130px;height:130px;
  margin:0 auto 22px;
  background:radial-gradient(circle,#1a3328 0%,#000 100%);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid #c9a227;
  box-shadow:0 0 25px rgba(201,162,39,0.4), inset 0 0 20px rgba(201,162,39,0.2);
}
.logo-wrap img{width:90%;height:90%;object-fit:contain;border-radius:50%}
.logo-text{
  width:130px;height:130px;
  margin:0 auto 22px;
  background:#000;
  border-radius:50%;
  border:2px solid #d4af37;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  box-shadow:0 0 30px rgba(212,175,55,0.5);
  color:#d4af37;
  font-family:'Cinzel',serif;
  font-weight:800;
  font-size:22px;
  line-height:1;
}
.logo-text span{font-size:10px;letter-spacing:2px;margin-top:4px;color:#fff}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(212,175,55,0.3);
  padding:7px 16px;border-radius:100px;
  font-size:10px;font-weight:700;letter-spacing:1px;
  color:#d4af37;margin-bottom:18px;
}
.title{
  font-family:'Cinzel',serif;
  font-size:30px;font-weight:800;
  color:#fff;letter-spacing:1px;
  margin-bottom:14px;
}
.subtitle{
  font-size:14px;font-weight:700;
  color:#fff;display:flex;align-items:center;
  justify-content:center;gap:6px;margin-bottom:8px;
}
.desc{
  font-size:11px;color:#7a9a8a;
  letter-spacing:0.5px;margin-bottom:26px;
}
.btn-telegram{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;
  background:linear-gradient(90deg,#ffcc33,#ffdb66);
  color:#000;
  padding:18px;
  border-radius:100px;
  font-size:15px;font-weight:900;
  text-decoration:none;
  letter-spacing:0.5px;
  box-shadow:0 8px 25px rgba(255,204,51,0.35);
  transition:0.2s;
}
.btn-telegram:active{transform:scale(0.97)}
.btn-telegram svg{width:24px;height:24px}
.small-text{
  font-size:9px;color:#5a7a6a;letter-spacing:1.2px;
  margin-top:14px;font-weight:600;
}
.stats{
  margin-top:22px;
  display:flex;
  background:rgba(0,0,0,0.3);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:18px;
  padding:14px 10px;
}
.stat{flex:1;text-align:center;border-right:1px solid rgba(255,255,255,0.06)}
.stat:last-child{border:0}
.stat b{display:block;color:#ffcc33;font-size:18px;font-weight:900;margin-bottom:3px}
.stat span{font-size:8px;color:#6a8a7a;letter-spacing:1px;font-weight:700}
</style>
</head>
<body>

<div class="card">
  <!-- Logo - Aap apna logo yahan laga sakte ho -->
<div class="logo-wrap"><img src="logo.png"></div>
<div style="font-size:12px;color:#fff;margin:2px 0">GOD X </div>
    <span>HARRY</span>
  </div>

  <div class="badge">🛡️ COMMUNITY & STRATEGY</div>

  <div class="title">GOD X HARRY</div>

  <div class="subtitle">🔥 NUMBER SHOT 🔥</div>
  <div class="desc">Market Trends • Strategy Discussions • Daily Updates</div>

  <a href="https://t.me/+LcvvQsa6vWEwYzM1" class="btn-telegram">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.16.16-.295.295-.605.295l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.12.832.941z"/></svg>
    JOIN TELEGRAM →
  </a>

  <div class="small-text">⚡ INSTANT ACCESS • FREE COMMUNITY</div>

  <div class="stats">
    <div class="stat"><b>24/7</b><span>COMMUNITY</span></div>
    <div class="stat"><b>8K+</b><span>MEMBERS</span></div>
    <div class="stat"><b>LIVE</b><span>UPDATES</span></div>
  </div>
</div>

</body>
</html>
